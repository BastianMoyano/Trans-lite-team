[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teams-lite"
version = "0.3.0"
description = "Recoverable Teams audio capture with offline CPU transcription"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0,<3",
  "PySide6>=6.11,<6.13",
  "SoundCard==0.4.6",
]

[project.optional-dependencies]
asr = [
  "onnx-asr[cpu,hub]==0.12.0",
  "onnxruntime==1.31.1",
]
ocr = [
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<0.4",
]
vision = [
  "wevisone-vl @ git+https://github.com/Tencent/WeVisOne-VL.git@9a6bcd85404505df0d05cfb5d97512ccacf35dee",
]
build = ["pyinstaller>=6.16,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
teams-lite = "teams_lite.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_lite"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

